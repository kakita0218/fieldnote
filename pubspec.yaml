name: fieldnote
description: FieldNote iPad-first construction inspection app.
publish_to: "none"
version: 1.2.0+4

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.3.0
  file_picker: ^11.0.2
  pdfx: ^2.9.2
  image_picker: ^1.1.2
  camera: ^0.11.0+2
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  archive: ^4.0.9
  pdf: ^3.12.0
  file_saver: ^0.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/fieldnote_logo_reference.png
    - assets/images/home_building_wireframe.png
